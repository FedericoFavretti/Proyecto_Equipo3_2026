spring.application.name=demo
server.port=8080

spring.datasource.url=jdbc:${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

security.jwt.secret=${JWT_SECRET:change-this-secret-key-change-this-secret-key-123456}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:2700000}

mercadopago.access-token=${MP_ACCESS_TOKEN}
mercadopago.back-url-success=${MP_SUCCESS_URL}
mercadopago.back-url-failure=${MP_FAILURE_URL}
mercadopago.back-url-pending=${MP_PENDING_URL}
mercadopago.webhook-url=${MP_WEBHOOK_URL}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173