# Perfil "it": solo se usa en las pruebas de integracion.
# El datasource real lo inyecta Testcontainers via @ServiceConnection,
# aca solo completamos las propiedades que la app exige y que no tienen
# valor por defecto en application.properties, para que el contexto levante.

spring.jpa.hibernate.ddl-auto=none

mercadopago.access-token=TEST-dummy-access-token
mercadopago.back-url-success=http://localhost:5173/pago/exito
mercadopago.back-url-failure=http://localhost:5173/pago/error
mercadopago.back-url-pending=http://localhost:5173/pago/pendiente
mercadopago.webhook-url=http://localhost:8080/api/v1/pagos/webhook

cloudinary.cloud-name=demo
cloudinary.api-key=000000000000000
cloudinary.api-secret=dummy-secret

spring.mail.username=test@foodly.com
spring.mail.password=dummy-password

app.password-reset.frontend-base-url=http://localhost:5173
app.account.activation-frontend-base-url=http://localhost:5173

app.pedido.url=http://localhost:5173/pedidos
app.reclamo.url=http://localhost:5173/reclamos

# Bajamos el ruido de logs para que la salida de los tests sea legible
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet=INFO
logging.level.org.springframework.web.multipart=INFO
logging.level.com.example.demo=INFO
